<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SPEAK V1.3 · Booking a Tour</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#18243b;font:16px/1.45 system-ui,-apple-system,Arial,sans-serif}main{max-width:480px;margin:auto;padding:12px 12px 30px}.card{background:white;border:1px solid #e0e7f0;border-radius:17px;padding:17px;margin:9px 0;box-shadow:0 2px 10px #172c5010}h1{font-size:19px;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-weight:700;color:#375789}.track{height:6px;background:#e3e9f3;border-radius:8px;margin:13px 0;overflow:hidden}.fill{height:100%;background:#13856c;width:0;transition:width .2s}.tag{font-size:11px;font-weight:800;letter-spacing:.07em;color:#61718a;margin-bottom:5px}.ai{font-size:18px;line-height:1.45;background:#eff5ff;border-radius:12px;padding:15px;margin:10px 0}.task{font-size:17px;font-weight:650;margin:12px 0 3px}.said{background:#f5f7fa;border-radius:10px;padding:12px;min-height:49px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}button{border:0;border-radius:12px;padding:15px 12px;min-height:50px;font-size:16px;font-weight:750;cursor:pointer;background:#123e88;color:white}button:disabled{opacity:.45;cursor:not-allowed}.outline{background:#edf3ff;color:#174484}.start{background:#078369}.stop{background:#bd3b40}.next{background:#164789}.full{width:100%;margin-top:11px}.feedback{padding:11px 12px;border-radius:10px;margin-top:12px;font-weight:650}.good{background:#e1f8ec;color:#14623c}.warn{background:#fff1d9;color:#8c5700}.bad{background:#ffebea;color:#9a3030}.quiet{font-size:13px;color:#66758c}.hide{display:none!important}.tip{font-size:14px;margin-top:8px;color:#5c4b18}.results{line-height:1.9}.footer{text-align:center;margin-top:12px}a{color:#244b83}@media(min-width:600px){main{padding-top:28px}}
</style></head><body><main>
<section class="card"><header><h1>BOOKING A TOUR</h1><span id="count" class="count">1 / 6</span></header><div class="track"><div id="fill" class="fill"></div></div><div class="tag">AI · TOURIST</div><div id="aiText" class="ai"></div><button id="listen" class="outline">🔊 LISTEN</button><div class="tag" style="margin-top:17px">YOUR TASK</div><div id="task" class="task"></div></section>
<section class="card" id="practice"><div class="tag">YOU SAID</div><div id="said" class="said">Tap START to speak.</div><div id="feedback" class="feedback hide" aria-live="polite"></div><div id="tip" class="tip hide"></div><button id="idea" class="outline full hide" type="button">💡 IDEA 1</button><div class="actions"><button id="start" class="start">🎤 START</button><button id="stop" class="stop" disabled>■ STOP</button></div><button id="next" class="next full">NEXT →</button><div id="busy" class="quiet footer" aria-live="polite"></div></section>
<section class="card hide" id="summary"><h1>FINISHED</h1><div id="results" class="results"></div><button id="restart" class="full">↻ START AGAIN</button></section>
</main><script>
'use strict';
const API='https://speak-test-api.ptmdung.workers.dev/validate';
const STT='https://speak-test-api.ptmdung.workers.dev/transcribe';
const tasks=[
 {id:'ASK_DESTINATION',fn:'ASK_QUESTION',intent:'DESTINATION_QUERY',info:'DESTINATION',ai:"Hi! I'd like to book a tour, please.",instruction:'Ask the tourist where they would like to travel.',hints:['ask • destination','Where would you like to ______?','Where would you like to travel?']},
 {id:'GIVE_ACTIVITY_INFORMATION',fn:'GIVE_INFORMATION',intent:'ACTIVITY_INFORMATION',info:'ACTIVITY',ai:'I would like to visit some interesting places. What activities does the tour include?',instruction:'Tell the tourist what activities the tour includes.',hints:['give • activities','The tour includes sightseeing and ______.','The tour includes sightseeing and local food.']},
 {id:'ASK_ACCOMMODATION',fn:'ASK_QUESTION',intent:'ACCOMMODATION_QUERY',info:'ACCOMMODATION',ai:'That sounds great. I also need a place to stay.',instruction:'Ask the tourist where they would like to stay.',hints:['ask • accommodation','Where would you like to ______?','Where would you like to stay?']},
 {id:'ASK_DURATION',fn:'ASK_QUESTION',intent:'DURATION_QUERY',info:'DURATION',ai:'A hotel would be nice. I am not sure how long to stay.',instruction:'Ask how many nights the tourist would like to stay.',hints:['ask • duration','How many nights would you like to ______?','How many nights would you like to stay?']},
 {id:'GIVE_PRICE_INFORMATION',fn:'GIVE_INFORMATION',intent:'PRICE_INFORMATION',info:'PRICE',ai:'I would like to stay for three nights. How much does the tour cost?',instruction:'Tell the tourist the tour price.',hints:['give • price','The tour costs ______ dollars.','The tour costs 150 dollars.']},
 {id:'CONFIRM_BOOKING',fn:'CONFIRM',intent:'BOOKING_CONFIRMATION',info:'BOOKING',ai:'That price sounds good. Please book the tour for me.',instruction:'Confirm the tourist’s booking.',hints:['confirm • booking','Your booking is ______.','Your booking is confirmed.']}
];

const $=id=>document.getElementById(id);
const supported=!!(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder);
let index=0,records=[],attempts=0,hintLevel=0,grade="",passed=false,busy=false,recording=false,stream=null,recorder=null,chunks=[],recordId=0,voice=null,done=false;
const samples=tasks.map(t=>t.hints[2]);
function feedback(message,kind,tip=''){$('feedback').textContent=message;$('feedback').className='feedback '+kind;$('tip').textContent=tip;$('tip').classList.toggle('hide',!tip)}
function showIdea(){if(hintLevel>=3)return;hintLevel++;$('tip').textContent='💡 IDEA '+hintLevel+': '+tasks[index].hints[hintLevel-1];$('tip').classList.remove('hide');$('idea').textContent=hintLevel<3?'💡 IDEA '+(hintLevel+1):'💡 IDEA 3';$('idea').classList.toggle('hide',hintLevel>=3)}
function correction(message){grade='';passed=false;feedback('NEEDS CORRECTION','warn',message);$('idea').classList.remove('hide');$('idea').textContent='💡 IDEA '+Math.min(3,hintLevel+1);showIdea()}
function resetFeedback(){$('feedback').className='feedback hide';$('tip').classList.add('hide');$('idea').classList.add('hide');$('busy').textContent=''}
function controls(){$('start').disabled=!supported||busy||recording||done;$('stop').disabled=!recording;$('next').disabled=busy||recording||done;$('listen').disabled=recording||busy||done}
function draw(){const t=tasks[index];$('count').textContent=(index+1)+' / '+tasks.length;$('fill').style.width=(index/tasks.length*100)+'%';$('aiText').textContent=t.ai;$('task').textContent=t.instruction;$('said').textContent='Tap START to speak.';resetFeedback();controls()}
function release(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}
function voices(){const list=speechSynthesis.getVoices();voice=list.find(v=>v.name.toLowerCase().includes('google us english')&&v.lang.toLowerCase().startsWith('en'))||list.find(v=>v.lang.toLowerCase()==='en-us')||list.find(v=>v.lang.toLowerCase().startsWith('en'))||null}
function listen(){if(!('speechSynthesis'in window))return feedback('Audio unavailable.','bad');voices();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tasks[index].ai);u.lang='en-US';u.rate=1;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function mime(){return ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||''}
async function start(){if(!supported||busy||recording||done)return;const id=++recordId;speechSynthesis?.cancel();resetFeedback();$('said').textContent='Listening…';$('busy').textContent='Allow microphone access if asked.';busy=true;controls();try{const st=await navigator.mediaDevices.getUserMedia({audio:true});if(id!==recordId){st.getTracks().forEach(x=>x.stop());return}stream=st;chunks=[];const type=mime();recorder=type?new MediaRecorder(st,{mimeType:type}):new MediaRecorder(st);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onerror=()=>{if(id!==recordId)return;release();recording=false;busy=false;feedback('Recording error. Try again.','bad');controls()};recorder.onstop=async()=>{release();if(id!==recordId)return;recording=false;const blob=new Blob(chunks,{type:(recorder.mimeType||type||'audio/webm').split(';')[0]});chunks=[];controls();if(!blob.size){busy=false;feedback('No audio. Try again.','warn');controls();return}await transcribe(blob,id)};recorder.start(250);recording=true;busy=false;$('busy').textContent='Speak, then tap STOP.';controls()}catch(e){release();recording=false;busy=false;$('said').textContent='Tap START to try again.';feedback('Microphone unavailable. Check permission.','bad');controls()}}
function stop(){if(!recording||recorder?.state!=='recording')return;busy=true;$('busy').textContent='Processing…';recorder.stop();controls()}
async function post(url,body,headers,ms){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),ms);try{const r=await fetch(url,{method:'POST',headers,body,signal:ctrl.signal});const txt=await r.text();let data;try{data=JSON.parse(txt)}catch{throw Error('Invalid server response')}if(!r.ok||data.ok!==true)throw Error(data.error||data.message||'Server error');return data}finally{clearTimeout(timer)}}
async function transcribe(blob,id){busy=true;$('busy').textContent='Checking your answer…';controls();try{const data=await post(STT,blob,{'Content-Type':blob.type||'audio/webm'},65000);if(id!==recordId)return;const text=[data.transcript,data.text,data.transcription,data.result?.transcript,data.result?.text].find(v=>typeof v==='string'&&v.trim());if(!text){feedback('Could not hear clearly. Try again.','warn');$('said').textContent='—';return}$('said').textContent=text.trim();attempts++;await validate(text.trim(),id)}catch(e){if(id===recordId)feedback('Could not check. Tap START to retry.','warn')}finally{if(id===recordId){busy=false;$('busy').textContent='';controls()}}}
// Conservative grammar patterns for six defined tasks. Not a general grammar checker.
function grammar(text,task){const s=text.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9$' ]/g,' ').replace(/\s+/g,' ').trim();const wrong=(msg)=>({level:'wrong',msg});const minor=(msg)=>({level:'minor',msg});const ok=()=>({level:'correct'});
if(!s||s.split(' ').length<3)return wrong('Please say a complete sentence.');
switch(task){
case 0: if(/\b(where|which)\b.*\b(would|do|are|can)\b.*\b(you|your)\b.*\b(travel|go|visit|destination|like)\b/.test(s)||/\bwhere do you want to (go|travel)\b/.test(s))return ok();break;
case 1: if(/\b(the tour|this tour|our tour|it) (include|offer|provide|have)\b/.test(s))return minor('Correct: The tour includes sightseeing and local food.');if(/\b(the tour|this tour|our tour|it) (includes|offers|provides|has)\b.+/.test(s)||/\byou (can|will) (visit|see|enjoy|explore|try)\b.+/.test(s)||/\bwe (will|can) (visit|see|enjoy|explore|try)\b.+/.test(s))return ok();break;
case 2: if(/\b(where|which)\b.*\b(would|do|will)\b.*\byou\b.*\b(stay|hotel|accommodation|prefer)\b/.test(s)||/\bdo you (want|prefer|plan) to stay\b/.test(s)||/\bwould you (like|prefer) (a|to)\b.*\b(hotel|stay|room)\b/.test(s))return ok();break;
case 3: if(/\bhow many nights you (want|like|plan|need)\b/.test(s))return minor('Correct: How many nights do you want to stay?');if(/\bhow (many nights|long) (do|would|will|are) you\b/.test(s)||/\bhow many nights would you like\b/.test(s))return ok();break;
case 4: if(/\b(the tour|this tour|our tour|it) cost\b/.test(s))return minor('Correct: The tour costs 150 dollars.');if(/\b(the tour|this tour|our tour|it) (costs|is)\b.*(\d|dollars|usd|price|hundred|fifty|twenty|thirty|forty|sixty|seventy|eighty|ninety)\b/.test(s)||/\b(the price|total price) is\b.*(\d|dollars|usd|hundred)\b/.test(s))return ok();break;
case 5: if(/\be book\b|\bebook\b|\bbook taxi\b/.test(s))return wrong('Say “Your tour is booked.”');if(/\b(your|the) (tour|booking|reservation) (is|has been) (booked|confirmed|reserved)\b/.test(s)||/\bi (have|will) (booked|confirm|reserve) (your|the) (tour|booking|reservation)\b/.test(s)||/\bwe (have|will) (booked|confirmed|reserved|confirm|reserve) (your|the) (tour|booking|reservation)\b/.test(s))return ok();break;
}return wrong('Try a complete, correct sentence.');}
async function validate(text,id){const t=tasks[index];const g=grammar(text,index);if(g.level==='wrong'){correction(g.msg);return}const payload={currentTask:t.id,expectedFunction:t.fn,expectedIntent:t.intent,expectedInformation:t.info,learnerTranscript:text};try{const data=await post(API,JSON.stringify(payload),{'Content-Type':'application/json'},35000);if(id!==recordId)return;const c=data.classification||{};const norm=x=>String(x||'').trim().toUpperCase();const match=norm(c.function)===t.fn&&norm(c.intent)===t.intent&&norm(c.information)===t.info&&c.semanticMatch===true&&norm(c.confidence)==='HIGH';passed=match;if(match){grade=g.level==='minor'?'GOOD':'EXCELLENT';feedback(grade==='GOOD'?'✓ GOOD':'★ EXCELLENT','good',g.level==='minor'?g.msg:'')}else correction('Try again.')}catch(e){passed=false;feedback('Could not check. Tap START to retry.','warn')}}
function next(){if(busy||recording||done)return;records.push({task:index+1,pass:passed,grade,attempts,hintLevel});if(index===tasks.length-1){finish();return}index++;attempts=0;hintLevel=0;grade='';passed=false;draw()}
function finish(){done=true;$('practice').classList.add('hide');$('summary').classList.remove('hide');$('fill').style.width='100%';$('count').textContent='6 / 6';const ex=records.filter(r=>r.grade==='EXCELLENT').length,gd=records.filter(r=>r.grade==='GOOD').length,sk=6-ex-gd;$('results').textContent='EXCELLENT: '+ex+' · GOOD: '+gd+' · SKIPPED: '+sk;controls()}
function restart(){recordId++;release();speechSynthesis?.cancel();index=0;records=[];attempts=0;hintLevel=0;grade='';passed=false;busy=false;recording=false;done=false;$('practice').classList.remove('hide');$('summary').classList.add('hide');draw()}
$('idea').onclick=showIdea;$('listen').onclick=listen;$('start').onclick=start;$('stop').onclick=stop;$('next').onclick=next;$('restart').onclick=restart;
if('speechSynthesis'in window){voices();speechSynthesis.addEventListener('voiceschanged',voices)}
if(!supported){feedback('Use Chrome and allow microphone access.','bad');controls()}
window.addEventListener('pagehide',()=>{recordId++;release();speechSynthesis?.cancel()});draw();
</script></body></html>
